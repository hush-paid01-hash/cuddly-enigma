openapi: 3.0.3
info:
  title: hush catalog API
  version: 1.0.0
  description: Public built-in website catalog. Personal data stays on the client.
servers:
  - url: https://hushpaid.netlify.app/api/v1
  - url: http://localhost:8787/api/v1
paths:
  /health:
    get:
      summary: Check API availability
      responses:
        '200':
          description: API is available
          content:
            application/json:
              schema:
                type: object
                required: [status, apiVersion]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  apiVersion:
                    type: integer
                    enum: [1]
  /catalog:
    get:
      summary: Read the complete built-in catalog and ordered trails
      responses:
        '200':
          description: Catalog, cacheable for 300 seconds
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, sites, trails]
                properties:
                  schemaVersion:
                    type: integer
                    enum: [1]
                  sites:
                    type: array
                    items:
                      $ref: '#/components/schemas/Site'
                  trails:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trail'
  /sites:
    get:
      summary: Search and filter the built-in destinations
      parameters:
        - in: query
          name: q
          description: All words must match; case-insensitive across name, URL, description, category, and topics.
          schema:
            type: string
            maxLength: 200
        - in: query
          name: category
          schema:
            type: string
            default: All websites
            enum: [All websites, Social, Entertainment, Work, Learn, Create, Everyday]
        - in: query
          name: trail
          description: A trail ID from /catalog. Results retain trail order.
          schema:
            type: string
            example: research
      responses:
        '200':
          description: Matching sites, cacheable for 300 seconds
          content:
            application/json:
              schema:
                type: object
                required: [sites, total]
                properties:
                  sites:
                    type: array
                    items:
                      $ref: '#/components/schemas/Site'
                  total:
                    type: integer
                    minimum: 0
        '400':
          description: Invalid category, unknown trail, or query longer than 200 characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Site:
      type: object
      required: [id, name, url, description, category, icon]
      properties:
        id:
          type: string
          example: wikipedia
        name:
          type: string
          example: Wikipedia
        url:
          type: string
          format: uri
          description: An HTTP or HTTPS URL without credentials.
        description:
          type: string
        category:
          type: string
          enum: [Social, Entertainment, Work, Learn, Create, Everyday]
        icon:
          type: string
        topics:
          type: array
          items:
            type: string
    Trail:
      type: object
      required: [id, name, description, sites]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        sites:
          type: array
          description: Ordered site IDs from the catalog.
          items:
            type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
