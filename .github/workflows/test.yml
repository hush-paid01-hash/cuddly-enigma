name: Comprehensive Testing Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Swift
        uses: swift-actions/setup-swift@v1
      - name: Test Game Engine
        run: |
          cd GameEngine
          swift test --verbose
      - name: Test Emulation Framework
        run: |
          cd EmulationResearch
          swift test --verbose
      - name: Test Game Store SDK
        run: |
          cd GameStore/SDK
          swift test --verbose
      - name: Test Retro Emulator
        run: |
          cd RetroEmulator
          swift test --verbose
      - name: Upload Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: unit-test-results
          path: .test-results/

  integration-tests:
    name: Integration Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Integration Testing
        run: |
          cd Tests/Integration
          ./run_integration_tests.sh
      - name: Upload Integration Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: integration-test-results
          path: Tests/Integration/results/

  ui-tests-simulator:
    name: UI Tests (Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Launch Simulator
        run: |
          xcrun simctl create "test-device" com.apple.CoreSimulator.SimDeviceType.iPhone14 com.apple.CoreSimulator.SimRuntime.iOS-16-4
          xcrun simctl boot test-device
      - name: Run UI Tests
        run: |
          xcodebuild test \
            -scheme GameEngine \
            -destination 'generic/platform=iOS Simulator,name=test-device' \
            -derivedDataPath build
      - name: Shutdown Simulator
        run: xcrun simctl shutdown all
      - name: Upload UI Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: ui-test-results
          path: build/Logs/Test/

  code-coverage:
    name: Code Coverage Analysis
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Generate Coverage Report
        run: |
          xcodebuild -scheme GameEngine \
            -enableCodeCoverage YES \
            test
      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: swift
          verbose: true
      - name: Comment PR with Coverage
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./coverage.lcov

  test-results-summary:
    name: Test Results Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [unit-tests, integration-tests, ui-tests-simulator, code-coverage]
    steps:
      - name: Download All Test Results
        uses: actions/download-artifact@v3
      - name: Generate Report
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Unit Tests: Passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Integration Tests: Passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ UI Tests: Passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Code Coverage: Analyzed" >> $GITHUB_STEP_SUMMARY
