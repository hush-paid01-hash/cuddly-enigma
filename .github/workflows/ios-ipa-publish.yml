name: Publish iOS IPA

on:
  workflow_dispatch:
    inputs:
      signed:
        description: Export a signed IPA (requires Apple distribution secrets)
        type: boolean
        default: false
      export_method:
        description: Distribution method matching the provisioning profile
        type: choice
        options:
          - release-testing
          - app-store-connect
        default: release-testing
      release_tag:
        description: Git tag to create/update for the GitHub Release
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a pre-release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      IPA_MODE: ${{ inputs.signed && 'signed' || 'unsigned' }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - run: npm ci

      - name: Import distribution signing credentials
        if: env.IPA_MODE == 'signed'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISION_PROFILE_BASE64 IOS_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          umask 077
          keychain="$RUNNER_TEMP/hush-signing.keychain-db"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PY'
          import datetime, os, pathlib, plistlib, shutil
          with open(os.environ['RUNNER_TEMP'] + '/profile.plist', 'rb') as file:
              profile = plistlib.load(file)
          team = os.environ['IOS_TEAM_ID']
          if team not in profile['TeamIdentifier']:
              raise SystemExit('Provisioning profile does not match IOS_TEAM_ID')
          if profile['Entitlements']['application-identifier'].split('.', 1)[1] != 'site.hushpaid.app':
              raise SystemExit('Provisioning profile must match site.hushpaid.app')
          if profile['ExpirationDate'] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):
              raise SystemExit('Provisioning profile has expired')
          uuid = profile['UUID']
          if not all(c in '0123456789abcdefABCDEF-' for c in uuid) or not uuid:
              raise SystemExit('Invalid provisioning profile UUID')
          directory = pathlib.Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles'
          directory.mkdir(parents=True, exist_ok=True)
          shutil.copy(os.environ['RUNNER_TEMP'] + '/profile.mobileprovision', directory / (uuid + '.mobileprovision'))
          with open(os.environ['GITHUB_ENV'], 'a') as file:
              file.write(f'IOS_PROFILE_UUID={uuid}\nIOS_TEAM_ID={team}\n')
          PY

      - name: Build device archive and IPA
        env:
          IOS_EXPORT_METHOD: ${{ inputs.export_method }}
        run: npm run ios:ipa -- "$IPA_MODE"

      - name: Create checksum
        run: |
          set -euo pipefail
          ipa="ios/App/output/$IPA_MODE/hush-$IPA_MODE.ipa"
          shasum -a 256 "$ipa" | awk '{print $1}' > "$ipa.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: hush iOS ${{ env.IPA_MODE }} (${{ github.run_number }})
          prerelease: ${{ inputs.prerelease }}
          files: |
            ios/App/output/${{ env.IPA_MODE }}/hush-${{ env.IPA_MODE }}.ipa
            ios/App/output/${{ env.IPA_MODE }}/hush-${{ env.IPA_MODE }}.ipa.sha256

      - name: Describe release link
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          ipa="hush-$IPA_MODE.ipa"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$ipa"
          echo "Direct IPA link (paste into ESign):" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing credentials
        if: always() && env.IPA_MODE == 'signed'
        run: |
          security delete-keychain "$RUNNER_TEMP/hush-signing.keychain-db" || true
          if [[ -n "${IOS_PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"

